<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Vänster Höger" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="icon" href="apple-touch-icon.png" />
    <title>Vänster eller höger</title>
    <style>
      :root {
        color: #f5f5f5;
        background: #000;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(32rem, calc(100% - 2rem));
        text-align: center;
      }

      h1 {
        margin: 0 0 2rem;
        font-size: clamp(2rem, 8vw, 3.5rem);
        letter-spacing: -0.05em;
      }

      .buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }

      button {
        border: 2px solid #f5f5f5;
        border-radius: 1rem;
        padding: 2rem 1rem;
        color: inherit;
        background: transparent;
        font: inherit;
        font-size: 1.25rem;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover,
      button:focus-visible {
        color: #000;
        background: #f5f5f5;
      }

      button:focus-visible {
        outline: 3px solid #6d5dfc;
        outline-offset: 3px;
      }

      #status {
        min-height: 3rem;
        margin: 2rem 0 0;
        color: #a3a3a3;
        line-height: 1.5;
      }

      #status strong { color: #f5f5f5; }

      #elapsed {
        display: block;
        margin-top: 0.25rem;
        color: #f5f5f5;
        font-weight: 700;
      }

      .history {
        margin-top: 3rem;
        text-align: left;
      }

      .history h2 {
        margin: 0 0 1rem;
        font-size: 1rem;
      }

      #history-list {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      #history-list li {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.75rem 0;
        border-top: 1px solid #292929;
      }

      #history-list time { color: #a3a3a3; }

      .clear-button {
        display: block;
        width: auto;
        margin: 1rem auto 0 0;
        padding: 0.5rem 0.75rem;
        border-color: #4a4a4a;
        border-radius: 0.75rem;
        color: #a3a3a3;
        font-size: 0.875rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Vänster eller höger?</h1>
      <div class="buttons">
        <button type="button" data-choice="Vänster">Vänster</button>
        <button type="button" data-choice="Höger">Höger</button>
      </div>
      <p id="status" aria-live="polite"></p>
      <section class="history" aria-labelledby="history-title">
        <h2 id="history-title">Senaste 24 timmarna</h2>
        <ul id="history-list"></ul>
        <button class="clear-button" id="clear-history" type="button">Rensa data</button>
      </section>
    </main>

    <script>
      const storageKey = "val-historik";
      const legacyStorageKey = "senaste-val";
      const dayInMilliseconds = 24 * 60 * 60 * 1000;
      const status = document.querySelector("#status");
      const historyList = document.querySelector("#history-list");
      const clearHistoryButton = document.querySelector("#clear-history");
      let lastChoice = null;
      let history = [];

      function elapsedText(time) {
        const minutes = (Date.now() - new Date(time).getTime()) / 60000;

        if (minutes < 1) return "Nyss";
        if (minutes < 60) return `${Math.floor(minutes)} minuter sen`;

        const hours = minutes / 60;
        if (hours < 24) {
          const value = new Intl.NumberFormat("sv-SE", {
            maximumFractionDigits: 1,
          }).format(hours);
          return `${value} ${hours < 1.5 ? "timme" : "timmar"} sen`;
        }

        const days = Math.floor(hours / 24);
        return `${days} ${days === 1 ? "dag" : "dagar"} sen`;
      }

      function showLastChoice(entry) {
        lastChoice = entry;

        if (!entry) {
          status.textContent = "Inget val har gjorts ännu.";
          return;
        }

        const time = new Intl.DateTimeFormat("sv-SE", {
          dateStyle: "medium",
          timeStyle: "short",
        }).format(new Date(entry.time));

        status.replaceChildren();
        const choice = document.createElement("strong");
        choice.textContent = entry.choice;
        const elapsed = document.createElement("span");
        elapsed.id = "elapsed";
        elapsed.textContent = elapsedText(entry.time);
        status.append("Senast: ", choice, ` · ${time}`, elapsed);
      }

      function isRecent(entry) {
        const time = new Date(entry?.time).getTime();
        return (
          (entry?.choice === "Vänster" || entry?.choice === "Höger") &&
          Number.isFinite(time) &&
          time > Date.now() - dayInMilliseconds
        );
      }

      function saveHistory() {
        localStorage.setItem(storageKey, JSON.stringify(history));
      }

      function showHistory() {
        historyList.replaceChildren();

        if (history.length === 0) {
          const empty = document.createElement("li");
          empty.textContent = "Inga tryck ännu.";
          historyList.append(empty);
          return;
        }

        [...history].reverse().forEach((entry) => {
          const item = document.createElement("li");
          const choice = document.createElement("strong");
          const time = document.createElement("time");

          choice.textContent = entry.choice;
          time.dateTime = entry.time;
          time.textContent = new Intl.DateTimeFormat("sv-SE", {
            day: "numeric",
            month: "short",
            hour: "2-digit",
            minute: "2-digit",
          }).format(new Date(entry.time));

          item.append(choice, time);
          historyList.append(item);
        });
      }

      function readHistory() {
        try {
          const saved = JSON.parse(localStorage.getItem(storageKey));
          const entries = Array.isArray(saved) ? saved.filter(isRecent) : [];

          if (entries.length === 0) {
            const legacyEntry = JSON.parse(localStorage.getItem(legacyStorageKey));
            if (isRecent(legacyEntry)) entries.push(legacyEntry);
          }

          localStorage.removeItem(legacyStorageKey);
          return entries;
        } catch {
          return [];
        }
      }

      document.querySelectorAll("button").forEach((button) => {
        if (!button.dataset.choice) return;

        button.addEventListener("click", () => {
          const entry = {
            choice: button.dataset.choice,
            time: new Date().toISOString(),
          };

          history = history.filter(isRecent);
          history.push(entry);
          saveHistory();
          showLastChoice(entry);
          showHistory();
        });
      });

      clearHistoryButton.addEventListener("click", () => {
        if (!confirm("Vill du radera alla sparade tryck?")) return;

        history = [];
        localStorage.removeItem(storageKey);
        localStorage.removeItem(legacyStorageKey);
        showLastChoice(null);
        showHistory();
      });

      history = readHistory();
      saveHistory();
      showLastChoice(history.at(-1));
      showHistory();
      setInterval(() => {
        history = history.filter(isRecent);
        saveHistory();
        showLastChoice(history.at(-1));
        showHistory();
      }, 30000);
    </script>
  </body>
</html>
