<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1ea" />
    <title>Vänster eller höger</title>
    <style>
      :root {
        color: #171717;
        background: #f4f1ea;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(32rem, calc(100% - 2rem));
        text-align: center;
      }

      h1 {
        margin: 0 0 2rem;
        font-size: clamp(2rem, 8vw, 3.5rem);
        letter-spacing: -0.05em;
      }

      .buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }

      button {
        border: 2px solid #171717;
        border-radius: 1rem;
        padding: 2rem 1rem;
        color: inherit;
        background: transparent;
        font: inherit;
        font-size: 1.25rem;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover,
      button:focus-visible {
        color: #fff;
        background: #171717;
      }

      button:focus-visible {
        outline: 3px solid #6d5dfc;
        outline-offset: 3px;
      }

      #status {
        min-height: 3rem;
        margin: 2rem 0 0;
        color: #5c5a55;
        line-height: 1.5;
      }

      #status strong { color: #171717; }

      #elapsed {
        display: block;
        margin-top: 0.25rem;
        color: #171717;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Vänster eller höger?</h1>
      <div class="buttons">
        <button type="button" data-choice="Vänster">Vänster</button>
        <button type="button" data-choice="Höger">Höger</button>
      </div>
      <p id="status" aria-live="polite"></p>
    </main>

    <script>
      const storageKey = "senaste-val";
      const status = document.querySelector("#status");
      let lastChoice = null;

      function elapsedText(time) {
        const minutes = (Date.now() - new Date(time).getTime()) / 60000;

        if (minutes < 1) return "Nyss";
        if (minutes < 60) return `${Math.floor(minutes)} minuter sen`;

        const hours = minutes / 60;
        if (hours < 24) {
          const value = new Intl.NumberFormat("sv-SE", {
            maximumFractionDigits: 1,
          }).format(hours);
          return `${value} ${hours < 1.5 ? "timme" : "timmar"} sen`;
        }

        const days = Math.floor(hours / 24);
        return `${days} ${days === 1 ? "dag" : "dagar"} sen`;
      }

      function showLastChoice(entry) {
        lastChoice = entry;

        if (!entry) {
          status.textContent = "Inget val har gjorts ännu.";
          return;
        }

        const time = new Intl.DateTimeFormat("sv-SE", {
          dateStyle: "medium",
          timeStyle: "medium",
        }).format(new Date(entry.time));

        status.replaceChildren();
        const choice = document.createElement("strong");
        choice.textContent = entry.choice;
        const elapsed = document.createElement("span");
        elapsed.id = "elapsed";
        elapsed.textContent = elapsedText(entry.time);
        status.append("Senast: ", choice, ` · ${time}`, elapsed);
      }

      function readLastChoice() {
        try {
          return JSON.parse(localStorage.getItem(storageKey));
        } catch {
          return null;
        }
      }

      document.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => {
          const entry = {
            choice: button.dataset.choice,
            time: new Date().toISOString(),
          };

          localStorage.setItem(storageKey, JSON.stringify(entry));
          showLastChoice(entry);
        });
      });

      showLastChoice(readLastChoice());
      setInterval(() => {
        if (lastChoice) showLastChoice(lastChoice);
      }, 30000);
    </script>
  </body>
</html>
